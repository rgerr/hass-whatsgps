name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Installeren
        run: pip install "pytest-homeassistant-custom-component==0.13.373" ruff mypy
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy custom_components scripts tests
      - name: Pytest
        run: pytest -q
