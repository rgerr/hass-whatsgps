name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check version and collect release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"${version}\"" custom_components/whatsgps/manifest.json
          awk -v v="${version}" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
